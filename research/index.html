window.CAL_MONTHS = ["2026-08", "2026-09"];
window.CAL_CUR = "2026-08";
(function() {
  const grid = document.getElementById('cal-grid');
  const title = document.getElementById('cal-title');
  const summary = document.getElementById('cal-summary');
  const tip = document.getElementById('cal-tip');
  const statusLabel = {pending: '待发生', occurred: '已发生·待验证', verified: '已验证'};
  const statusColor = {verified: '#2e7d32', occurred: '#856404', pending: '#1565c0'};
  const STATUS_FILL = {verified: '已验证', occurred: '已发生', pending: '待发生'};
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function getMonthIdx(m) { return window.CAL_MONTHS.indexOf(m); }
  function nextMonth(m) {
    const [y, mm] = m.split('-').map(Number);
    const nm = mm === 12 ? 1 : mm + 1;
    const ny = mm === 12 ? y + 1 : y;
    return ny + '-' + pad(nm);
  }
  function prevMonth(m) {
    const [y, mm] = m.split('-').map(Number);
    const pm = mm === 1 ? 12 : mm - 1;
    const py = mm === 1 ? y - 1 : y;
    return py + '-' + pad(pm);
  }
  function render() {
    const evs = window.CAL_DATA[window.CAL_CUR] || [];
    // 计算该月第一天是周几和天数
    const [yy, mm] = window.CAL_CUR.split('-').map(Number);
    const first = new Date(yy, mm - 1, 1);
    const ndays = new Date(yy, mm, 0).getDate();
    // 周一为首日（0=Mon）
    const wd0 = (first.getDay() + 6) % 7;
    title.textContent = yy + ' 年 ' + mm + ' 月';
    // 重建日期格（保留头部 7 个 wd）
    while (grid.children.length > 7) grid.removeChild(grid.lastChild);
    const evByDay = {};
    evs.forEach(e => {
      const d = parseInt(e.date.slice(8, 10), 10);
      if (!evByDay[d]) evByDay[d] = [];
      evByDay[d].push(e);
    });
    for (let i = 0; i < wd0; i++) {
      const c = document.createElement('div');
      c.className = 'cal-cell cal-empty';
      grid.appendChild(c);
    }
    for (let d = 1; d <= ndays; d++) {
      const c = document.createElement('div');
      const isToday = (d === new Date().getDate() && mm === new Date().getMonth() + 1 && yy === new Date().getFullYear());
      const dayDate = new Date(yy, mm - 1, d);
      const isPast = dayDate < new Date(new Date().toDateString());  // 早于今天（不含今天）
      c.className = 'cal-cell cal-day ' + (isPast ? 'past' : 'future');
      if (isToday) c.style.background = '#fff8e1';
      const evList = evByDay[d] || [];
      const evHtml = evList.map((e, idx) => {
        const color = statusColor[e.status] || '#666';
        return '<div class="cal-ev" data-eid="' + window.CAL_CUR + '-' + d + '-' + idx + '" '
          + 'style="background:' + color + '" data-ev=\'' + JSON.stringify(e).replace(/'/g, "&#39;") + '\'>'
          + (e.event || '').slice(0, 14) + '</div>';
      }).join('');
      c.innerHTML = '<div class="cal-date" ' + (isToday ? 'style="color:#d6336c"' : '') + '>' + d + '</div>' + evHtml;
      grid.appendChild(c);
    }
    // 补齐尾空格
    const total = wd0 + ndays;
    const tail = (7 - total % 7) % 7;
    for (let i = 0; i < tail; i++) {
      const c = document.createElement('div');
      c.className = 'cal-cell cal-empty';
      grid.appendChild(c);
    }
    // hover tooltip
    grid.querySelectorAll('.cal-ev').forEach(el => {
      el.addEventListener('mouseenter', e => {
        const ev = JSON.parse(el.getAttribute('data-ev'));
        const lines = [
          '<b style="font-size:1.05em">' + ev.event + '</b>',
          '状态：' + (statusLabel[ev.status] || ev.status),
          '关联标的：' + (ev.target || '—'),
          '预期：' + ev.expected,
          '实际：' + ev.actual,
        ];
        if (ev.verify_note) lines.push('验证说明：' + ev.verify_note);
        tip.innerHTML = lines.join('<br>');
        tip.style.display = 'block';
      });
      el.addEventListener('mousemove', e => {
        const pad = 14;
        let x = e.clientX + pad, y = e.clientY + pad;
        if (x + tip.offsetWidth > window.innerWidth) x = e.clientX - tip.offsetWidth - pad;
        if (y + tip.offsetHeight > window.innerHeight) y = e.clientY - tip.offsetHeight - pad;
        tip.style.left = x + 'px';
        tip.style.top = y + 'px';
      });
      el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
    // 摘要：本月事件分布
    const counts = {pending: 0, occurred: 0, verified: 0};
    evs.forEach(e => { counts[e.status] = (counts[e.status] || 0) + 1; });
    const parts = [];
    if (counts.pending) parts.push('<span style="color:#1565c0">● 待发生 ' + counts.pending + '</span>');
    if (counts.occurred) parts.push('<span style="color:#856404">● 已发生 ' + counts.occurred + '</span>');
    if (counts.verified) parts.push('<span style="color:#2e7d32">● 已验证 ' + counts.verified + '</span>');
    summary.innerHTML = '本月共 ' + evs.length + ' 个事件：' + (parts.join('　') || '无');
    // 翻页按钮可用性
    document.getElementById('cal-prev').disabled = getMonthIdx(prevMonth(window.CAL_CUR)) < 0;
    document.getElementById('cal-next').disabled = getMonthIdx(nextMonth(window.CAL_CUR)) < 0;
  }
  document.getElementById('cal-prev').onclick = () => {
    const p = prevMonth(window.CAL_CUR);
    if (getMonthIdx(p) >= 0) { window.CAL_CUR = p; render(); }
  };
  document.getElementById('cal-next').onclick = () => {
    const n = nextMonth(window.CAL_CUR);
    if (getMonthIdx(n) >= 0) { window.CAL_CUR = n; render(); }
  };
  render();
})();
</script>

const NAMES = {"510300": "沪深300", "510500": "中证500", "512100": "中证1000", "588000": "科创50", "512480": "半导体", "512660": "军工", "512690": "酒", "512170": "医疗", "512800": "银行", "512400": "有色/铜", "515790": "光伏", "518880": "黄金", "513100": "纳指", "511090": "30年国债", "501018": "油气", "515220": "煤炭", "513050": "中概互联", "511010": "国债ETF", "511260": "十年国债", "512880": "证券", "515180": "红利ETF", "159915": "创业板", "512000": "券商", "512760": "芯片", "515000": "科技", "512980": "传媒", "512010": "医药", "159928": "消费", "513500": "标普500", "513180": "恒生科技", "159920": "恒生", "513520": "日经", "159985": "豆粕", "510880": "红利", "511380": "可转债", "159949": "创业板50", "516160": "新能源", "513060": "恒生医疗", "515880": "通信ETF"};
fetch('articles.json').then(r => r.json()).then(d => {
  ARTS = d.articles || [];
  initFilters();
  applyUrlParams();
  render();
}).catch(e => { document.getElementById('count').textContent = '加载索引失败（本地 file:// 打开时正常，线上可用）: ' + e; });

function initFilters() {
  const fill = (id, vals) => {
    const sel = document.getElementById(id);
    [...new Set(vals)].sort().forEach(v => {
      const o = document.createElement('option');
      o.value = o.textContent = v; sel.appendChild(o);
    });
  };
  fill('f-inst', ARTS.map(a => a.author));
  fill('f-theme', ARTS.flatMap(a => a.themes));
  [...new Set(ARTS.flatMap(a => Object.keys(a.etf_sentiment || {})))].sort().forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c + (NAMES[c] ? ' ' + NAMES[c] : '');
    document.getElementById('f-etf').appendChild(o);
  });
  ['q','f-inst','f-theme','f-etf','f-view','f-level','f-min','f-max','f-from','f-to'].forEach(id =>
    document.getElementById(id).addEventListener('input', render));
}

function applyUrlParams() {
  const p = new URLSearchParams(location.search);
  const map = {q:'q', inst:'f-inst', theme:'f-theme', etf:'f-etf', view:'f-view',
                level:'f-level', min:'f-min', max:'f-max', from:'f-from', to:'f-to'};
  for (const [k, id] of Object.entries(map)) {
    const v = p.get(k);
    if (v !== null && v !== '') document.getElementById(id).value = v;
  }
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const inst = document.getElementById('f-inst').value;
  const theme = document.getElementById('f-theme').value;
  const etf = document.getElementById('f-etf').value;
  const view = document.getElementById('f-view').value;
  const level = document.getElementById('f-level').value;
  const min = parseFloat(document.getElementById('f-min').value) || 0;
  const max = parseFloat(document.getElementById('f-max').value) || 99;
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const rows = ARTS.filter(a => {
    if (inst && a.author !== inst) return false;
    if (theme && !(a.themes || []).includes(theme)) return false;
    if (etf && !(a.etf_sentiment || {})[etf]) return false;
    if (view && a.viewpoint !== view) return false;
    if (level && a.level !== level) return false;
    if (from && a.date < from) return false;
    if (to && a.date > to) return false;
    const sc = a.scores ? (a.scores.total || 0) : 0;
    if (sc < min || sc > max) return false;
    if (q) {
      const hay = (a.title + a.summary + a.author + (a.themes||[]).join()
        + Object.keys(a.etf_sentiment || {})
            .map(k => k + ' ' + (NAMES[k] || '')).join()).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('count').textContent = '命中 ' + rows.length + ' / ' + ARTS.length + ' 篇';
  window.__filteredRows = rows.slice().sort((x, y) => y.date.localeCompare(x.date) || y.scores.total - x.scores.total);
  window.__currentPage = 1;
  _renderPage();
}

function _renderPage() {
  const rows = window.__filteredRows || [];
  const pageSize = 10;
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (window.__currentPage > pages) window.__currentPage = pages;
  if (window.__currentPage < 1) window.__currentPage = 1;
  const start = (window.__currentPage - 1) * pageSize;
  const shown = rows.slice(start, start + pageSize);
  const tb = document.getElementById('tbody');
  tb.innerHTML = shown.map(a => {
    const etfs = Object.entries(a.etf_sentiment || {}).map(([k, v]) =>
      '<a href="index.html?etf=' + k + '">' + k + '</a>' +
      (NAMES[k] ? '<span class="dim" style="font-size:.82em"> ' + NAMES[k] + '</span>' : '') +
      (v === '多' ? '<span style="color:#d6336c">↑</span>' : v === '空' ? '<span style="color:#2e8b57">↓</span>' : '·')
    ).join(' ') || '-';
    const s = a.scores ? a.scores.total.toFixed(1) : '-';
    const themes = (a.themes || []).map(t => {
      const slug = THEME_SLUG[t];
      return slug ? '<a class="theme-chip" href="themes.html#t-' + slug + '">' + t + '</a>'
                  : '<span class="theme-chip">' + t + '</span>';
    }).join('') || '-';
    return '<tr><td>' + a.date + '</td>'
      + '<td class="t"><a href="' + a.page + '">' + a.title + '</a></td>'
      + '<td>' + a.author + '</td>'
      + '<td>' + themes + '</td>'
      + '<td><span class="score">' + s + '</span></td>'
      + '<td class="vp-' + (a.viewpoint || '') + '">' + (a.viewpoint || '-') + '</td>'
      + '<td>' + etfs + '</td>'
      + '<td><span class="lv-' + a.level + '">' + ({detail:'详读',brief:'速览',archived:'归档'}[a.level] || a.level) + '</span></td>'
      + '<td>' + (a.url ? '<a href="' + a.url + '" target="_blank">原文</a>' : '-') + '</td></tr>';
  }).join('') || '<tr><td colspan=9 style="color:#999;padding:20px">无匹配结果</td></tr>';
  // 翻页条
  const bar = document.getElementById('search-pg');
  if (total <= pageSize) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  document.getElementById('pg-info').textContent = '第 ' + window.__currentPage + '/' + pages + ' 页（共 ' + total + ' 篇）';
  // 页码按钮（最多 7 个：当前 ±3）
  const btnFirst = document.getElementById('pg-first');
  const btnPrev = document.getElementById('pg-prev');
  const btnNext = document.getElementById('pg-next');
  const btnLast = document.getElementById('pg-last');
  btnFirst.disabled = window.__currentPage === 1;
  btnPrev.disabled = window.__currentPage === 1;
  btnNext.disabled = window.__currentPage === pages;
  btnLast.disabled = window.__currentPage === pages;
  let pageStart = Math.max(1, window.__currentPage - 3);
  let pageEnd = Math.min(pages, pageStart + 6);
  pageStart = Math.max(1, pageEnd - 6);
  const pagesHtml = [];
  for (let p = pageStart; p <= pageEnd; p++) {
    pagesHtml.push('<button class="pg-btn" data-pg="' + p + '" ' + (p === window.__currentPage ? 'disabled' : '') + '>' + p + '</button>');
  }
  document.getElementById('pg-pages').innerHTML = pagesHtml.join(' ');
  document.querySelectorAll('#pg-pages .pg-btn').forEach(b => {
    b.onclick = () => { window.__currentPage = parseInt(b.dataset.pg, 10); _renderPage(); window.scrollTo({top: document.getElementById('count').offsetTop - 60, behavior: 'smooth'}); };
  });
  btnFirst.onclick = () => { window.__currentPage = 1; _renderPage(); };
  btnPrev.onclick = () => { if (window.__currentPage > 1) { window.__currentPage--; _renderPage(); } };
  btnNext.onclick = () => { if (window.__currentPage < pages) { window.__currentPage++; _renderPage(); } };
  btnLast.onclick = () => { window.__currentPage = pages; _renderPage(); };
}
</script>

  background: #333; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; line-height: 1.5;
  max-width: 340px; width: max-content; white-space: normal; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
</style>
<script>
(function(){
  const G = {"DR001": "银行间存款类机构隔夜质押式回购加权利率，资金面松紧的核心观测指标", "DR007": "银行间存款类机构7天质押式回购加利率，央行重点关注的市场利率", "社融": "社会融资规模：实体经济从金融体系获得的融资总额，衡量信用扩张力度", "M2": "广义货币供应量，反映全社会货币总量", "M1": "狭义货币供应量（现金+单位活期存款），反映资金活化程度", "PMI": "采购经理指数，50为荣枯线，高于50代表景气扩张", "荣枯线": "PMI 的 50 分界线，之上扩张、之下收缩", "CPI": "居民消费价格指数，衡量通胀水平", "PPI": "工业生产者出厂价格指数，衡量上游工业品价格", "摊余成本法": "按买入成本+应计利息计价的估值方法，净值波动小，与市值法相对", "二永债": "二级资本债与永续债的合称，银行补充资本的信用债品种", "买断式逆回购": "央行买入债券并约定日后卖回的操作，向市场投放中长期流动性", "逆回购": "央行向一级交易商买入债券并约定未来卖回，向市场投放短期流动性", "久期": "债券价格对利率变动的敏感度，久期越长利率风险越大", "资产荒": "优质高收益资产稀缺、资金追逐有限资产的格局", "K型分化": "总量平稳但内部一部分向上、另一部分向下的分化形态", "城投债": "地方政府融资平台发行的债券", "ARR": "年度经常性收入（Annual Recurring Income），SaaS/AI 公司核心景气指标", "REITs": "不动产投资信托基金，以租金等稳定现金流为收益来源", "可转债": "可按约定价格转股的债券，兼具债性与股性", "转债": "可转换债券的简称，可按约定转股，兼具债性与股性", "活跃券": "某期限中成交最活跃、定价基准性最强的国债个券", "MLF": "中期借贷便利，央行向银行投放中期资金的工具，政策利率之一", "LPR": "贷款市场报价利率，银行贷款定价基准", "利差压缩": "信用利差或期限利差缩小，债券相对性价比下降", "利差": "两类债券收益率的差值，常用作估值/风险补偿的度量", "挤仓": "期货近月合约因可交割现货不足导致的逼空行情", "净融资": "新发规模减去到期偿还后的净增量", "止盈": "达到目标收益后卖出锁定利润", "TL": "30年期国债期货合约", "银行间杠杆率": "质押式回购余额/可质押债券托管量，衡量债市杠杆水平", "一致预期": "市场参与者预期的中位数/主流看法，实际偏离时常引发交易", "预期差": "实际情况与市场预期的偏离，超额收益的主要来源", "净值化管理": "资管产品按市价估值、不再刚性兑付的监管要求", "标普500": "美国500家大盘股指数，美股核心宽基", "纳指": "纳斯达克指数，美股科技股代表指数"};
  const terms = Object.keys(G).sort((a, b) => b.length - a.length);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const parts = terms.map(t => /^[A-Za-z0-9]+$/.test(t)
    ? '(?<![A-Za-z0-9])' + esc(t) + '(?![A-Za-z0-9])' : esc(t));
  const re = new RegExp(parts.join('|'), 'g');
  function walk(node){
    if (node.nodeType === 3){
      const s = node.textContent;
      re.lastIndex = 0;
      if (!re.test(s)) return;
      re.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = re.exec(s))){
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        const sp = document.createElement('span');
        sp.className = 'term'; sp.textContent = m[0];
        sp.setAttribute('data-tip', G[m[0]] || '');
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      node.parentNode.replaceChild(frag, node);
    } else if (node.nodeType === 1 && !/^(SCRIPT|STYLE|CODE|A|TEXTAREA|INPUT|SELECT|BUTTON)$/.test(node.tagName)){
      Array.from(node.childNodes).forEach(walk);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ walk(document.body); });
  else walk(document.body);
})();
</script>
