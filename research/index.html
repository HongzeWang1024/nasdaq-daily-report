<body>

<table class="cat">

<h2>历史日报</h2>
<ul class="days">
<li><a href="research_20260821.html">2026-08-21</a></li>
</ul>

<script>
let ARTS = [];
const THEME_SLUG = {"科技股": "ff46804f", "市场情绪": "d56e9e72", "信用债": "4e382717", "宏观经济": "9043c47f", "利率债": "95635520", "金融科技": "bd593ebe", "海外利率": "40fdac59", "地缘政治": "4865f02b", "AI产业链": "f4dd1c74", "可转债": "234a92ef", "理财": "a5b437b1", "产品创新": "fbb56f78", "REITs": "a7507b75", "量化": "03860b39", "超长债": "d15af0b4", "资产配置": "f2d95807", "大宗商品": "81d09717", "港股": "d82e5038", "美债": "224ae603", "流动性": "ef086e44", "公募基金": "144d7ddc"};
fetch('articles.json').then(r => r.json()).then(d => {
  ARTS = d.articles || [];
  initFilters();
  applyUrlParams();
  render();
}).catch(e => { document.getElementById('count').textContent = '加载索引失败（本地 file:// 打开时正常，线上可用）: ' + e; });

function initFilters() {
  const fill = (id, vals) => {
    const sel = document.getElementById(id);
    [...new Set(vals)].sort().forEach(v => {
      const o = document.createElement('option');
      o.value = o.textContent = v; sel.appendChild(o);
    });
  };
  fill('f-inst', ARTS.map(a => a.author));
  fill('f-theme', ARTS.flatMap(a => a.themes));
  fill('f-etf', ARTS.flatMap(a => Object.keys(a.etf_sentiment || {})));
  ['q','f-inst','f-theme','f-etf','f-view','f-level','f-min','f-max','f-from','f-to'].forEach(id =>
    document.getElementById(id).addEventListener('input', render));
}

function applyUrlParams() {
  const p = new URLSearchParams(location.search);
  const map = {q:'q', inst:'f-inst', theme:'f-theme', etf:'f-etf', view:'f-view',
                level:'f-level', min:'f-min', max:'f-max', from:'f-from', to:'f-to'};
  for (const [k, id] of Object.entries(map)) {
    const v = p.get(k);
    if (v !== null && v !== '') document.getElementById(id).value = v;
  }
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const inst = document.getElementById('f-inst').value;
  const theme = document.getElementById('f-theme').value;
  const etf = document.getElementById('f-etf').value;
  const view = document.getElementById('f-view').value;
  const level = document.getElementById('f-level').value;
  const min = parseFloat(document.getElementById('f-min').value) || 0;
  const max = parseFloat(document.getElementById('f-max').value) || 99;
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const rows = ARTS.filter(a => {
    if (inst && a.author !== inst) return false;
    if (theme && !(a.themes || []).includes(theme)) return false;
    if (etf && !(a.etf_sentiment || {})[etf]) return false;
    if (view && a.viewpoint !== view) return false;
    if (level && a.level !== level) return false;
    if (from && a.date < from) return false;
    if (to && a.date > to) return false;
    const sc = a.scores ? (a.scores.total || 0) : 0;
    if (sc < min || sc > max) return false;
    if (q) {
      const hay = (a.title + a.summary + a.author + (a.themes||[]).join()
        + Object.keys(a.etf_sentiment || {}).join()).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('count').textContent = '命中 ' + rows.length + ' / ' + ARTS.length + ' 篇';
  const tb = document.getElementById('tbody');
  tb.innerHTML = rows.slice().sort((x, y) => y.date.localeCompare(x.date) || y.scores.total - x.scores.total).map(a => {
    const etfs = Object.entries(a.etf_sentiment || {}).map(([k, v]) =>
      '<a href="index.html?etf=' + k + '">' + k + '</a>' +
      (v === '多' ? '<span style="color:#d6336c">↑</span>' : v === '空' ? '<span style="color:#2e8b57">↓</span>' : '·')
    ).join(' ') || '-';
    const s = a.scores ? a.scores.total.toFixed(1) : '-';
    const themes = (a.themes || []).map(t => {
      const slug = THEME_SLUG[t];
      return slug ? '<a class="theme-chip" href="themes.html#t-' + slug + '">' + t + '</a>'
                  : '<span class="theme-chip">' + t + '</span>';
    }).join('') || '-';
    return '<tr><td>' + a.date + '</td>'
      + '<td class="t"><a href="' + a.page + '">' + a.title + '</a></td>'
      + '<td>' + a.author + '</td>'
      + '<td>' + themes + '</td>'
      + '<td><span class="score">' + s + '</span></td>'
      + '<td class="vp-' + (a.viewpoint || '') + '">' + (a.viewpoint || '-') + '</td>'
      + '<td>' + etfs + '</td>'
      + '<td><span class="lv-' + a.level + '">' + ({detail:'详读',brief:'速览',archived:'归档'}[a.level] || a.level) + '</span></td>'
      + '<td>' + (a.url ? '<a href="' + a.url + '" target="_blank">原文</a>' : '-') + '</td></tr>';
  }).join('') || '<tr><td colspan=9 style="color:#999;padding:20px">无匹配结果</td></tr>';
}
</script>
<style>
.term { border-bottom: 1px dashed #b08fd0; cursor: help; position: relative; }
.term:hover::after { content: attr(data-tip); position: absolute; left: 0; bottom: 130%; z-index: 99;
  background: #333; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; line-height: 1.5;
  max-width: 340px; width: max-content; white-space: normal; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
</style>
<script>
(function(){
  const G = {"DR001": "银行间存款类机构隔夜质押式回购加权利率，资金面松紧的核心观测指标", "DR007": "银行间存款类机构7天质押式回购加利率，央行重点关注的市场利率", "社融": "社会融资规模：实体经济从金融体系获得的融资总额，衡量信用扩张力度", "M2": "广义货币供应量，反映全社会货币总量", "M1": "狭义货币供应量（现金+单位活期存款），反映资金活化程度", "PMI": "采购经理指数，50为荣枯线，高于50代表景气扩张", "荣枯线": "PMI 的 50 分界线，之上扩张、之下收缩", "CPI": "居民消费价格指数，衡量通胀水平", "PPI": "工业生产者出厂价格指数，衡量上游工业品价格", "摊余成本法": "按买入成本+应计利息计价的估值方法，净值波动小，与市值法相对", "二永债": "二级资本债与永续债的合称，银行补充资本的信用债品种", "买断式逆回购": "央行买入债券并约定日后卖回的操作，向市场投放中长期流动性", "逆回购": "央行向一级交易商买入债券并约定未来卖回，向市场投放短期流动性", "久期": "债券价格对利率变动的敏感度，久期越长利率风险越大", "资产荒": "优质高收益资产稀缺、资金追逐有限资产的格局", "K型分化": "总量平稳但内部一部分向上、另一部分向下的分化形态", "城投债": "地方政府融资平台发行的债券", "ARR": "年度经常性收入（Annual Recurring Income），SaaS/AI 公司核心景气指标", "REITs": "不动产投资信托基金，以租金等稳定现金流为收益来源", "可转债": "可按约定价格转股的债券，兼具债性与股性", "转债": "可转换债券的简称，可按约定转股，兼具债性与股性", "活跃券": "某期限中成交最活跃、定价基准性最强的国债个券", "MLF": "中期借贷便利，央行向银行投放中期资金的工具，政策利率之一", "LPR": "贷款市场报价利率，银行贷款定价基准", "利差压缩": "信用利差或期限利差缩小，债券相对性价比下降", "利差": "两类债券收益率的差值，常用作估值/风险补偿的度量", "挤仓": "期货近月合约因可交割现货不足导致的逼空行情", "净融资": "新发规模减去到期偿还后的净增量", "止盈": "达到目标收益后卖出锁定利润", "TL": "30年期国债期货合约", "银行间杠杆率": "质押式回购余额/可质押债券托管量，衡量债市杠杆水平", "一致预期": "市场参与者预期的中位数/主流看法，实际偏离时常引发交易", "预期差": "实际情况与市场预期的偏离，超额收益的主要来源", "净值化管理": "资管产品按市价估值、不再刚性兑付的监管要求", "标普500": "美国500家大盘股指数，美股核心宽基", "纳指": "纳斯达克指数，美股科技股代表指数"};
  const terms = Object.keys(G).sort((a, b) => b.length - a.length);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const parts = terms.map(t => /^[A-Za-z0-9]+$/.test(t)
    ? '(?<![A-Za-z0-9])' + esc(t) + '(?![A-Za-z0-9])' : esc(t));
  const re = new RegExp(parts.join('|'), 'g');
  function walk(node){
    if (node.nodeType === 3){
      const s = node.textContent;
      re.lastIndex = 0;
      if (!re.test(s)) return;
      re.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = re.exec(s))){
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        const sp = document.createElement('span');
        sp.className = 'term'; sp.textContent = m[0];
        sp.setAttribute('data-tip', G[m[0]] || '');
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      node.parentNode.replaceChild(frag, node);
    } else if (node.nodeType === 1 && !/^(SCRIPT|STYLE|CODE|A|TEXTAREA|INPUT|SELECT|BUTTON)$/.test(node.tagName)){
      Array.from(node.childNodes).forEach(walk);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ walk(document.body); });
  else walk(document.body);
})();
</script>
